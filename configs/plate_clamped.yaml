problem:
  type: plate
  geometry:
    a: 1.0
    b: 1.0
  material:
    D: 0.1
    nu: 0.3
  load:
    type: gaussian
    amplitude: -2.0
    center: [0.5, 0.5]
    sigma: [0.15, 0.15]
  boundary:
    left: {kind: clamped}
    right: {kind: clamped}
    bottom: {kind: clamped}
    top: {kind: clamped}
  boundary_enforcement: hard
  constitutive_enforcement: hard

model:
  architecture: split
  hidden_layers: [80, 80, 80, 80]
  activation: silu

training:
  dtype: float64
  device: auto
  adam_epochs: 10000
  lbfgs_max_iter: 1800
  collocation_points: 2000
  boundary_points: 80
  sampler: sobol
  adaptive_sampling:
    enabled: true
    resample_every: 1000
    candidate_pool: 8000
    chunk_size: 500
  adaptive_weighting:
    enabled: true
    update_every: 200

validation:
  enabled: true
  plate_reference: auto
  plate_ritz_order: 10
  plate_ritz_quadrature: 32

output:
  directory: runs/plate_clamped
  prediction_points: 101
